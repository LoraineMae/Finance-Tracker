<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Weekly Ledger</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #EFEAE0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
  #root { min-height: 100vh; }
  #boot-error {
    display: none;
    max-width: 480px;
    margin: 60px auto;
    padding: 20px;
    background: #FAF6EC;
    border: 1px solid #C23B3B;
    color: #2B2B28;
    font-family: monospace;
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .spin { animation: spin 1s linear infinite; display:inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>
<div id="boot-error"></div>

<script>
  window.addEventListener("error", function (e) {
    var box = document.getElementById("boot-error");
    box.style.display = "block";
    box.textContent =
      "Something failed to load and the app couldn't start.\n\n" +
      "Error: " + (e.message || "unknown error") +
      (e.filename ? "\nFile: " + e.filename + (e.lineno ? ":" + e.lineno : "") : "") +
      "\n\nOpen your browser's DevTools (F12) → Console tab for the full detail, " +
      "or share this message so it can be fixed.";
  });
</script>

<script type="text/babel" data-presets="react">

// ============================================================
// CONFIG — your Supabase project
// ============================================================
const SUPABASE_URL = "https://rfiiwcmsgjeuiutvxpuk.supabase.co";
const SUPABASE_KEY = "sb_publishable_3dB6HNgM5olaEO9sTxRSbw_-gHq2FAt";

const { useState, useEffect, useCallback, useMemo } = React;
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const PRESET_COLORS = ["#2E7D5B", "#6B4E9E", "#DB8A2B", "#2F5FA8", "#C23B3B", "#A5762F", "#4A7B8C"];
const DEFAULT_CATEGORIES = [
  { name: "Savings", color: "#2E7D5B", short: "SAVE", budget: 100, is_spaylater: false },
  { name: "Transport", color: "#6B4E9E", short: "TRIP", budget: 175, is_spaylater: false },
  { name: "Food", color: "#DB8A2B", short: "FOOD", budget: 150, is_spaylater: false },
  { name: "SPaylater Fund", color: "#2F5FA8", short: "SPAY", budget: 200, is_spaylater: true },
];

const FONT_MONO = "ui-monospace, SFMono-Regular, 'Roboto Mono', Menlo, Consolas, monospace";
const PAPER = "#FAF6EC";
const INK = "#2B2B28";
const FAINT = "#8a8370";
const LINE = "#D8D1BC";

const money = (n) =>
  "\u20b1" + (Math.round((Number(n || 0) + Number.EPSILON) * 100) / 100)
    .toLocaleString("en-PH", { minimumFractionDigits: 0, maximumFractionDigits: 2 });

function currentWeekOfMonth(d = new Date()) { return Math.min(4, Math.ceil(d.getDate() / 7)); }
function monthLabel(d = new Date()) { return d.toLocaleString("en-US", { month: "short", year: "numeric" }); }
function shiftMonth(d, delta) { return new Date(d.getFullYear(), d.getMonth() + delta, 1); }
function sameMonth(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth(); }

// ============================================================
// AUTH SCREEN
// ============================================================
function AuthScreen({ onAuthed }) {
  const [mode, setMode] = useState("signin");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [msg, setMsg] = useState(null);
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setBusy(true);
    setMsg(null);
    try {
      if (mode === "signin") {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      } else {
        const { error } = await sb.auth.signUp({ email, password });
        if (error) throw error;
        setMsg({ tone: "good", text: "Account created. Check your email to confirm, then sign in." });
      }
    } catch (e) {
      setMsg({ tone: "bad", text: e.message || "Something went wrong." });
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={styles.page}>
      <div style={styles.receipt}>
        <Teeth />
        <div style={styles.header}>
          <div style={styles.headerTitle}>WEEKLY LEDGER</div>
        </div>
        <div style={{ ...styles.subhead, marginTop: 4 }}>
          {mode === "signin" ? "sign in to your ledger" : "create your ledger account"}
        </div>
        <Dashes />
        <div style={styles.formLabel}>Email</div>
        <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} style={styles.noteInput} placeholder="you@email.com" />
        <div style={styles.formLabel}>Password</div>
        <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} style={styles.noteInput} placeholder="At least 6 characters" />
        {msg && (
          <div style={{ marginTop: 12, fontSize: 12, color: msg.tone === "bad" ? "#C23B3B" : "#2E7D5B" }}>
            {msg.text}
          </div>
        )}
        <button style={styles.saveBtn} onClick={submit} disabled={busy || !email || password.length < 6}>
          {busy ? "Please wait…" : mode === "signin" ? "Sign In" : "Sign Up"}
        </button>
        <div style={{ textAlign: "center", marginTop: 14, fontSize: 12, color: FAINT }}>
          {mode === "signin" ? (
            <span>New here? <a href="#" onClick={(e) => { e.preventDefault(); setMode("signup"); setMsg(null); }} style={styles.link}>Create an account</a></span>
          ) : (
            <span>Already have one? <a href="#" onClick={(e) => { e.preventDefault(); setMode("signin"); setMsg(null); }} style={styles.link}>Sign in</a></span>
          )}
        </div>
        <Dashes />
        <Teeth flip />
      </div>
    </div>
  );
}

// ============================================================
// MAIN APP
// ============================================================
function App({ session }) {
  const uid = session.user.id;
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [tab, setTab] = useState("week");
  const [week, setWeek] = useState(currentWeekOfMonth());
  const [transactions, setTransactions] = useState([]);
  const [categories, setCategories] = useState([]);
  const [spay, setSpay] = useState({});
  const [showForm, setShowForm] = useState(false);
  const [editingId, setEditingId] = useState(null);
  const [form, setForm] = useState({ category: "", amount: "", note: "" });
  const [saving, setSaving] = useState(false);
  const [filterCat, setFilterCat] = useState(null);
  const [showAddCat, setShowAddCat] = useState(false);
  const [newCat, setNewCat] = useState({ name: "", color: PRESET_COLORS[0], budget: "" });
  const [activeDate, setActiveDate] = useState(() => new Date(new Date().getFullYear(), new Date().getMonth(), 1));

  const month = monthLabel(activeDate);
  const isRealCurrentMonth = sameMonth(activeDate, new Date());
  const catNames = useMemo(() => new Set(categories.map((c) => c.name)), [categories]);

  // ---- load everything ----
  const loadAll = useCallback(async () => {
    setLoading(true);
    setError(null);
    try {
      let { data: cats, error: catErr } = await sb.from("categories").select("*").eq("user_id", uid).order("created_at");
      if (catErr) throw catErr;
      if (!cats || cats.length === 0) {
        const toInsert = DEFAULT_CATEGORIES.map((c) => ({ ...c, user_id: uid }));
        const { data: inserted, error: insErr } = await sb.from("categories").insert(toInsert).select();
        if (insErr) throw insErr;
        cats = inserted;
      }
      setCategories(cats);

      const { data: tx, error: txErr } = await sb.from("transactions").select("*").eq("user_id", uid).order("created_at", { ascending: false });
      if (txErr) throw txErr;
      setTransactions(tx || []);

      const { data: sp, error: spErr } = await sb.from("spaylater_months").select("*").eq("user_id", uid);
      if (spErr) throw spErr;
      const spMap = {};
      (sp || []).forEach((row) => { spMap[row.month] = { due: row.due ?? "", fundOverride: row.fund_override ?? "", _id: row.id }; });
      setSpay(spMap);
    } catch (e) {
      console.error(e);
      setError(e.message || "Couldn't load your data.");
    } finally {
      setLoading(false);
    }
  }, [uid]);

  useEffect(() => { loadAll(); }, [loadAll]);

  // ---- transactions ----
  const openAddForm = () => { setEditingId(null); setForm({ category: categories[0]?.name || "", amount: "", note: "" }); setShowForm(true); };
  const openEditForm = (t) => { setEditingId(t.id); setForm({ category: t.category, amount: String(t.amount), note: t.note || "" }); setShowForm(true); };

  const saveTransaction = async () => {
    const amt = parseFloat(form.amount);
    if (!amt || amt <= 0 || !form.category) return;
    setSaving(true);
    try {
      if (editingId) {
        const { error } = await sb.from("transactions").update({ category: form.category, amount: amt, note: form.note.trim() }).eq("id", editingId);
        if (error) throw error;
      } else {
        const { error } = await sb.from("transactions").insert({
          user_id: uid, week, month, category: form.category, amount: amt, note: form.note.trim(),
          date: new Date().toISOString().slice(0, 10),
        });
        if (error) throw error;
      }
      await loadAll();
      setShowForm(false);
      setEditingId(null);
    } catch (e) {
      setError(e.message);
    } finally {
      setSaving(false);
    }
  };

  const removeTransaction = async (id) => {
    try {
      const { error } = await sb.from("transactions").delete().eq("id", id);
      if (error) throw error;
      setTransactions((prev) => prev.filter((t) => t.id !== id));
    } catch (e) { setError(e.message); }
  };

  // ---- categories ----
  const updateCategoryBudget = async (id, val) => {
    setCategories((prev) => prev.map((c) => (c.id === id ? { ...c, budget: val } : c)));
    try {
      const { error } = await sb.from("categories").update({ budget: Number(val) || 0 }).eq("id", id);
      if (error) throw error;
    } catch (e) { setError(e.message); }
  };

  const setSpaylaterCategory = async (id) => {
    try {
      await sb.from("categories").update({ is_spaylater: false }).eq("user_id", uid);
      const { error } = await sb.from("categories").update({ is_spaylater: true }).eq("id", id);
      if (error) throw error;
      await loadAll();
    } catch (e) { setError(e.message); }
  };

  const addCategory = async () => {
    const name = newCat.name.trim();
    if (!name || catNames.has(name)) return;
    try {
      const { error } = await sb.from("categories").insert({
        user_id: uid, name, color: newCat.color, short: name.slice(0, 4).toUpperCase(),
        budget: Number(newCat.budget) || 0, is_spaylater: false,
      });
      if (error) throw error;
      await loadAll();
      setNewCat({ name: "", color: PRESET_COLORS[0], budget: "" });
      setShowAddCat(false);
    } catch (e) { setError(e.message); }
  };

  const deleteCategory = async (cat) => {
    if (categories.length <= 1) return;
    try {
      await sb.from("transactions").delete().eq("user_id", uid).eq("category", cat.name);
      const { error } = await sb.from("categories").delete().eq("id", cat.id);
      if (error) throw error;
      await loadAll();
    } catch (e) { setError(e.message); }
  };

  // ---- spaylater ----
  const updateSpay = async (patch) => {
    const cur = spay[month] || { due: "", fundOverride: "" };
    const nextLocal = { ...cur, ...patch };
    setSpay((prev) => ({ ...prev, [month]: nextLocal }));
    try {
      const { error } = await sb.from("spaylater_months").upsert(
        { user_id: uid, month, due: nextLocal.due === "" ? null : Number(nextLocal.due), fund_override: nextLocal.fundOverride === "" ? null : Number(nextLocal.fundOverride) },
        { onConflict: "user_id,month" }
      );
      if (error) throw error;
    } catch (e) { setError(e.message); }
  };

  const changeMonth = (delta) => setActiveDate((d) => shiftMonth(d, delta));
  const jumpToToday = () => { const t = new Date(); setActiveDate(new Date(t.getFullYear(), t.getMonth(), 1)); };

  // ---- derived: week ----
  const weekTx = transactions.filter((t) => t.week === week && t.month === month);
  const visibleWeekTx = filterCat ? weekTx.filter((t) => t.category === filterCat) : weekTx;
  const spentByCat = (cat) => weekTx.filter((t) => t.category === cat).reduce((s, t) => s + Number(t.amount), 0);
  const totalBudget = categories.reduce((a, c) => a + Number(c.budget || 0), 0);
  const totalSpent = weekTx.reduce((s, t) => s + Number(t.amount), 0);
  const remaining = totalBudget - totalSpent;

  // ---- derived: spaylater ----
  const spayCat = categories.find((c) => c.is_spaylater) || categories[0];
  const monthData = spay[month] || { due: "", fundOverride: "" };
  const fundSaved = monthData.fundOverride !== "" && monthData.fundOverride != null ? Number(monthData.fundOverride) : Number(spayCat?.budget || 0) * 4;
  const due = Number(monthData.due || 0);
  const surplus = fundSaved - due;

  const monthKeys = Object.keys(spay);
  let runningBuffer = 0;
  const bufferByMonth = {};
  monthKeys.forEach((m) => {
    const d = spay[m] || {};
    const fs = d.fundOverride !== "" && d.fundOverride != null ? Number(d.fundOverride) : Number(spayCat?.budget || 0) * 4;
    const du = Number(d.due || 0);
    runningBuffer += fs - du;
    bufferByMonth[m] = runningBuffer;
  });
  if (!(month in bufferByMonth)) bufferByMonth[month] = runningBuffer + surplus;
  const buffer = bufferByMonth[month];

  const recordedMonths = monthKeys.filter((m) => spay[m] && spay[m].due !== "" && spay[m].due != null);
  const trailing = recordedMonths.slice(-3);
  const trailingAvgSurplus = trailing.length > 0
    ? trailing.reduce((sum, m) => {
        const d = spay[m];
        const fs = d.fundOverride !== "" && d.fundOverride != null ? Number(d.fundOverride) : Number(spayCat?.budget || 0) * 4;
        return sum + (fs - Number(d.due || 0));
      }, 0) / trailing.length
    : null;
  let recoveryMessage;
  if (buffer >= 0) {
    recoveryMessage = { tone: "good", text: "Your SPaylater fund is ahead of your bills — nice work keeping it there." };
  } else if (trailingAvgSurplus === null) {
    recoveryMessage = { tone: "neutral", text: "Log a couple more months of \"Amount due\" to get a recovery estimate." };
  } else if (trailingAvgSurplus > 0) {
    const monthsNeeded = Math.ceil(Math.abs(buffer) / trailingAvgSurplus);
    recoveryMessage = { tone: "neutral", text: `At your recent pace (avg ${money(trailingAvgSurplus)}/month surplus), your buffer should turn positive in about ${monthsNeeded} more month${monthsNeeded === 1 ? "" : "s"}.` };
  } else {
    recoveryMessage = { tone: "bad", text: "Your recent bills have been outpacing your SPaylater fund, so the gap is growing rather than closing. Consider raising the weekly SPaylater amount or lowering new charges." };
  }

  // ---- derived: insights ----
  const monthTx = transactions.filter((t) => t.month === month);
  const weeklyTrend = [1, 2, 3, 4].map((w) => ({ label: "W" + w, spent: monthTx.filter((t) => t.week === w).reduce((s, t) => s + Number(t.amount), 0) }));
  const maxWeekSpend = Math.max(1, ...weeklyTrend.map((w) => w.spent));
  const catBreakdown = categories.map((c) => ({
    name: c.short, fullName: c.name, budget: Number(c.budget || 0) * 4,
    spent: monthTx.filter((t) => t.category === c.name).reduce((s, t) => s + Number(t.amount), 0), color: c.color,
  }));
  const monthSpent = monthTx.reduce((s, t) => s + Number(t.amount), 0);
  const monthBudget = totalBudget * 4;
  const biggestCat = [...catBreakdown].sort((a, b) => b.spent - a.spent)[0];
  const overCats = catBreakdown.filter((c) => c.spent > c.budget);
  const biggestSingle = [...monthTx].sort((a, b) => Number(b.amount) - Number(a.amount))[0];

  if (loading) {
    return (
      <div style={styles.loadingWrap}>
        <span className="spin">⟳</span>
        <span style={{ fontFamily: FONT_MONO, color: FAINT, fontSize: 13, marginLeft: 8 }}>opening the ledger…</span>
      </div>
    );
  }

  return (
    <div style={styles.page}>
      <div style={styles.receipt}>
        <Teeth />
        <div style={styles.header}>
          <div style={styles.headerTitle}>WEEKLY LEDGER</div>
        </div>
        <div style={styles.monthSwitcher}>
          <button style={styles.monthArrow} onClick={() => changeMonth(-1)}>‹</button>
          <span style={styles.subhead}>{month} · Week {week} of 4</span>
          <button style={styles.monthArrow} onClick={() => changeMonth(1)}>›</button>
        </div>
        {!isRealCurrentMonth && (
          <div style={styles.manualBadge}>Viewing {month} manually · <span style={styles.manualBadgeLink} onClick={jumpToToday}>jump to today</span></div>
        )}

        <div style={styles.tabRow}>
          {[["week", "This Week"], ["insights", "Insights"], ["spay", "SPaylater"], ["settings", "Settings"]].map(([key, label]) => (
            <button key={key} style={{ ...styles.tabBtn, ...(tab === key ? styles.tabBtnActive : {}) }} onClick={() => setTab(key)}>{label}</button>
          ))}
        </div>

        <Dashes />

        {tab === "week" && (
          <React.Fragment>
            <div style={styles.weekPicker}>
              {[1, 2, 3, 4].map((w) => (
                <button key={w} onClick={() => setWeek(w)} style={{ ...styles.weekChip, ...(w === week ? styles.weekChipActive : {}) }}>W{w}</button>
              ))}
            </div>
            <div style={styles.bigTotal}>{money(remaining)}<div style={styles.bigTotalLabel}>left of {money(totalBudget)} this week</div></div>
            <Dashes />
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {categories.map((c) => {
                const budget = Number(c.budget || 0);
                const spent = spentByCat(c.name);
                const pct = budget > 0 ? Math.min(100, (spent / budget) * 100) : 0;
                const over = spent > budget;
                return (
                  <div key={c.id}>
                    <div style={styles.catRow}>
                      <span style={{ ...styles.catDot, background: c.color }} />
                      <span style={styles.catName}>{c.name}</span>
                      <span style={{ ...styles.catAmt, color: over ? "#C23B3B" : INK }}>{money(spent)} / {money(budget)}</span>
                    </div>
                    <div style={styles.barTrack}><div style={{ ...styles.barFill, width: pct + "%", background: over ? "#C23B3B" : c.color }} /></div>
                  </div>
                );
              })}
            </div>
            <Dashes />
            <div style={styles.itemsHeader}><span>LOGGED THIS WEEK</span><span>{weekTx.length} item{weekTx.length === 1 ? "" : "s"}</span></div>
            <div style={styles.filterChipRow}>
              <button style={{ ...styles.filterChip, ...(filterCat === null ? styles.filterChipActive : {}) }} onClick={() => setFilterCat(null)}>All</button>
              {categories.map((c) => (
                <button key={c.id} style={{ ...styles.filterChip, ...(filterCat === c.name ? { background: c.color, borderColor: c.color, color: "#fff" } : {}) }} onClick={() => setFilterCat(filterCat === c.name ? null : c.name)}>{c.short}</button>
              ))}
            </div>
            {visibleWeekTx.length === 0 && (
              <div style={styles.emptyState}>{weekTx.length === 0 ? `Nothing logged for Week ${week} yet. Tap "Log expense" below to add one.` : "No items match this filter."}</div>
            )}
            <div style={{ display: "flex", flexDirection: "column", gap: 2 }}>
              {visibleWeekTx.map((t) => {
                const c = categories.find((x) => x.name === t.category);
                return (
                  <div key={t.id} style={styles.itemRow} onClick={() => openEditForm(t)}>
                    <span style={{ ...styles.catDot, background: c ? c.color : "#999" }} />
                    <div style={{ flex: 1, minWidth: 0 }}>
                      <div style={styles.itemCat}>{t.category}</div>
                      {t.note && <div style={styles.itemNote}>{t.note}</div>}
                    </div>
                    <div style={styles.itemAmt}>{money(t.amount)}</div>
                    <button onClick={(e) => { e.stopPropagation(); removeTransaction(t.id); }} style={styles.deleteBtn}>✕</button>
                  </div>
                );
              })}
            </div>
          </React.Fragment>
        )}

        {tab === "insights" && (
          <React.Fragment>
            <div style={styles.bigTotal}>{money(monthSpent)}<div style={styles.bigTotalLabel}>spent of {money(monthBudget)} this month</div></div>
            <Dashes />
            <div style={styles.chartLabel}>SPEND BY WEEK</div>
            <div style={{ display: "flex", gap: 10, alignItems: "flex-end", height: 90, marginBottom: 8 }}>
              {weeklyTrend.map((w) => (
                <div key={w.label} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 4 }}>
                  <div style={{ fontSize: 10, fontFamily: FONT_MONO, color: FAINT }}>{money(w.spent)}</div>
                  <div style={{ width: "100%", background: "#2F5FA8", borderRadius: "3px 3px 0 0", height: Math.max(4, (w.spent / maxWeekSpend) * 60) }} />
                  <div style={{ fontSize: 10, fontFamily: FONT_MONO, color: FAINT }}>{w.label}</div>
                </div>
              ))}
            </div>
            <Dashes />
            <div style={styles.chartLabel}>BUDGET VS ACTUAL (MONTH)</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {catBreakdown.map((c) => {
                const pct = c.budget > 0 ? Math.min(100, (c.spent / c.budget) * 100) : 0;
                const over = c.spent > c.budget;
                return (
                  <div key={c.name}>
                    <div style={styles.catRow}>
                      <span style={{ ...styles.catDot, background: c.color }} />
                      <span style={styles.catName}>{c.fullName}</span>
                      <span style={{ ...styles.catAmt, color: over ? "#C23B3B" : INK }}>{money(c.spent)} / {money(c.budget)}</span>
                    </div>
                    <div style={styles.barTrack}><div style={{ ...styles.barFill, width: pct + "%", background: over ? "#C23B3B" : c.color }} /></div>
                  </div>
                );
              })}
            </div>
            <Dashes />
            <div style={styles.chartLabel}>NOTES</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {biggestCat && biggestCat.spent > 0 && (
                <div style={styles.insightLine}>Most of this month's spend is going to <b>{biggestCat.fullName}</b> ({money(biggestCat.spent)}).</div>
              )}
              {overCats.length > 0 ? overCats.map((c) => (
                <div key={c.name} style={{ ...styles.insightLine, color: "#C23B3B" }}>{c.fullName} is over its monthly budget by {money(c.spent - c.budget)}.</div>
              )) : (
                <div style={{ ...styles.insightLine, color: "#2E7D5B" }}>Every category is within budget so far this month.</div>
              )}
              {biggestSingle && (
                <div style={styles.insightLine}>Biggest single expense: {money(biggestSingle.amount)} on {biggestSingle.category}{biggestSingle.note ? ` (${biggestSingle.note})` : ""}.</div>
              )}
            </div>
          </React.Fragment>
        )}

        {tab === "spay" && (
          <React.Fragment>
            <div style={styles.bigTotal}>{money(buffer)}<div style={styles.bigTotalLabel}>{buffer >= 0 ? "buffer ahead" : "you're behind, catch up next month"}</div></div>
            <Dashes />
            <div style={styles.spayGrid}>
              <div style={styles.spayLabel}>Month</div><div style={styles.spayValue}>{month}</div>
              <div style={styles.spayLabel}>Amount due</div>
              <input type="number" placeholder="e.g. 1700" value={monthData.due} onChange={(e) => updateSpay({ due: e.target.value })} style={styles.spayInput} />
              <div style={styles.spayLabel}>Fund saved</div>
              <input type="number" placeholder={String(Number(spayCat?.budget || 0) * 4)} value={monthData.fundOverride} onChange={(e) => updateSpay({ fundOverride: e.target.value })} style={styles.spayInput} />
              <div style={styles.spayLabel}>Surplus / shortfall</div>
              <div style={{ ...styles.spayValue, color: surplus >= 0 ? "#2E7D5B" : "#C23B3B", fontWeight: 700 }}>{surplus >= 0 ? "+" : ""}{money(surplus)}</div>
            </div>
            <div style={styles.hint}>Fund saved defaults to {spayCat?.name || "your SPaylater category"}'s weekly budget × 4. Type a real number above only if you saved something different this month.</div>
            <div style={{ ...styles.recoveryBox, borderColor: recoveryMessage.tone === "bad" ? "#C23B3B" : recoveryMessage.tone === "good" ? "#2E7D5B" : LINE }}>{recoveryMessage.text}</div>
            <Dashes />
            <div style={styles.itemsHeader}><span>MONTH HISTORY</span></div>
            {monthKeys.length === 0 && <div style={styles.emptyState}>This is your first tracked month.</div>}
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {monthKeys.map((m) => (
                <div key={m} style={styles.itemRow}>
                  <div style={{ flex: 1 }}><div style={styles.itemCat}>{m}</div><div style={styles.itemNote}>due {money(Number(spay[m].due || 0))}</div></div>
                  <div style={{ ...styles.itemAmt, color: bufferByMonth[m] >= 0 ? "#2E7D5B" : "#C23B3B" }}>{money(bufferByMonth[m])}</div>
                </div>
              ))}
            </div>
          </React.Fragment>
        )}

        {tab === "settings" && (
          <React.Fragment>
            <div style={styles.chartLabel}>CATEGORIES</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {categories.map((c) => (
                <div key={c.id} style={styles.settingsRow}>
                  <span style={{ ...styles.catDot, background: c.color }} />
                  <span style={{ ...styles.catName, flex: "0 0 auto", minWidth: 84 }}>{c.name}</span>
                  <input type="number" value={c.budget} onChange={(e) => updateCategoryBudget(c.id, e.target.value)} style={styles.budgetEditInput} />
                  <button title="Use as SPaylater fund" onClick={() => setSpaylaterCategory(c.id)} style={{ ...styles.spayToggle, ...(c.is_spaylater ? styles.spayToggleActive : {}) }}>{c.is_spaylater ? "✓" : "SP"}</button>
                  <button onClick={() => deleteCategory(c)} style={styles.deleteBtn} disabled={categories.length <= 1}>✕</button>
                </div>
              ))}
            </div>
            <div style={styles.totalLine}>Weekly total: <b>{money(totalBudget)}</b></div>
            {!showAddCat ? (
              <button style={styles.addCatBtn} onClick={() => setShowAddCat(true)}>+ Add category</button>
            ) : (
              <div style={styles.addCatForm}>
                <input type="text" placeholder="Category name" value={newCat.name} onChange={(e) => setNewCat((f) => ({ ...f, name: e.target.value }))} style={styles.noteInput} />
                <input type="number" placeholder="Weekly budget" value={newCat.budget} onChange={(e) => setNewCat((f) => ({ ...f, budget: e.target.value }))} style={{ ...styles.noteInput, marginTop: 8 }} />
                <div style={{ display: "flex", gap: 6, marginTop: 10 }}>
                  {PRESET_COLORS.map((col) => (
                    <button key={col} onClick={() => setNewCat((f) => ({ ...f, color: col }))} style={{ width: 22, height: 22, borderRadius: "50%", background: col, border: newCat.color === col ? `2px solid ${INK}` : "2px solid transparent", cursor: "pointer" }} />
                  ))}
                </div>
                <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
                  <button style={styles.saveBtnSmall} onClick={addCategory} disabled={!newCat.name.trim()}>Add</button>
                  <button style={styles.cancelBtnSmall} onClick={() => setShowAddCat(false)}>Cancel</button>
                </div>
              </div>
            )}
            <div style={styles.hint}>The SP badge marks which category funds your SPaylater tracker. Deleting a category also removes its logged expenses.</div>
            <Dashes />
            <button style={styles.cancelBtnSmall} onClick={() => sb.auth.signOut()}>Sign out</button>
          </React.Fragment>
        )}

        <Dashes />
        <Teeth flip />
      </div>

      {tab === "week" && !showForm && (
        <button style={styles.fab} onClick={openAddForm}>+ Log expense</button>
      )}

      {showForm && (
        <div style={styles.modalOverlay} onClick={() => setShowForm(false)}>
          <div style={styles.modal} onClick={(e) => e.stopPropagation()}>
            <div style={styles.modalHeader}>
              <span style={styles.modalTitle}>{editingId ? "Edit expense" : "Log an expense"}</span>
              <button style={styles.closeBtn} onClick={() => setShowForm(false)}>✕</button>
            </div>
            <div style={styles.formLabel}>Category</div>
            <div style={styles.chipWrap}>
              {categories.map((c) => (
                <button key={c.id} onClick={() => setForm((f) => ({ ...f, category: c.name }))} style={{ ...styles.chip, borderColor: c.color, background: form.category === c.name ? c.color : "transparent", color: form.category === c.name ? "#fff" : c.color }}>{c.short}</button>
              ))}
            </div>
            <div style={styles.formLabel}>Amount</div>
            <input type="number" autoFocus placeholder="0" value={form.amount} onChange={(e) => setForm((f) => ({ ...f, amount: e.target.value }))} style={styles.amountInput} />
            <div style={styles.formLabel}>Note (optional)</div>
            <input type="text" placeholder="e.g. lunch after class" value={form.note} onChange={(e) => setForm((f) => ({ ...f, note: e.target.value }))} style={styles.noteInput} />
            <button style={styles.saveBtn} disabled={!form.amount || saving} onClick={saveTransaction}>{saving ? "Saving…" : editingId ? "Save changes" : `Add to Week ${week}`}</button>
            {editingId && <button style={styles.deleteFullBtn} onClick={() => { removeTransaction(editingId); setShowForm(false); }}>Delete this expense</button>}
          </div>
        </div>
      )}

      {error && <div style={styles.errorBanner} onClick={() => setError(null)}>{error}</div>}
    </div>
  );
}

function Dashes() { return <div style={styles.dashes} />; }
function Teeth({ flip }) {
  const teeth = new Array(24).fill(0);
  return <div style={{ ...styles.teeth, transform: flip ? "scaleY(-1)" : "none" }}>{teeth.map((_, i) => <span key={i} style={styles.tooth} />)}</div>;
}

// ============================================================
// ROOT — handles auth session
// ============================================================
function Root() {
  const [session, setSession] = useState(undefined);

  useEffect(() => {
    sb.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: sub } = sb.auth.onAuthStateChange((_event, sess) => setSession(sess));
    return () => sub.subscription.unsubscribe();
  }, []);

  if (session === undefined) {
    return <div style={styles.loadingWrap}><span className="spin">⟳</span><span style={{ fontFamily: FONT_MONO, color: FAINT, fontSize: 13, marginLeft: 8 }}>loading…</span></div>;
  }
  if (!session) return <AuthScreen />;
  return <App session={session} key={session.user.id} />;
}
